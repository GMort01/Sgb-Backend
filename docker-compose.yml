services:
  backend-prod:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_PATH: /app/data/biblioteca.db
    volumes:
      - backend_data:/app/data
    restart: unless-stopped

volumes:
  backend_data: